<!-- ========================================================
     Bootstrap: fetch GA4 data from Apps Script, then load
     React + Babel and render the dashboard.
     ======================================================== -->
<script>
(function() {
  const loading = document.getElementById('loading');
  function fail(msg) {
    loading.classList.add('error');
    loading.innerHTML = msg;
  }

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    fail('<strong>Setup incomplete.</strong><br>Edit <code>index.html</code> and replace <code>YOUR_APPS_SCRIPT_URL_HERE</code> (near the top of the file) with the Web App URL from your Apps Script deployment. See <code>README.md</code> for the full setup walkthrough.');
    return;
  }

  loading.innerHTML = '<span class="spinner"></span>Fetching GA4 data… (this can take 5–10 seconds on first load)';

  fetch(APPS_SCRIPT_URL + '?endpoint=all')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (data.error) throw new Error(data.error);
      window.__DATA__ = data;
      loadScriptsAndRender();
    })
    .catch(err => {
      fail('<strong>Failed to load GA4 data.</strong><br><br>' +
           '<code>' + (err && err.message || err) + '</code><br><br>' +
           'Common causes:<br>' +
           '• Apps Script URL incorrect or not deployed<br>' +
           '• Apps Script "Who has access" is set to "Only myself" instead of "Anyone"<br>' +
           '• Google Analytics Data API service not added to the Apps Script project<br>' +
           '• Google account that deployed the script lacks access to GA4 property ' +
           '<br><br>See <code>README.md</code> troubleshooting section.');
    });

  function loadScriptsAndRender() {
    const cdns = [
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js'
    ];
    let i = 0;
    function next() {
      if (i >= cdns.length) return runDashboard();
      const s = document.createElement('script');
      s.src = cdns[i++];
      s.onload = next;
      s.onerror = () => fail('Failed to load: <code>' + s.src + '</code><br>Check your internet connection.');
      document.head.appendChild(s);
    }
    next();
  }

  function runDashboard() {
    try {
      const tpl = document.getElementById('dashboard-source');
      const src = tpl.textContent;
      const out = Babel.transform(src, {presets: ['react']}).code;
      loading.style.display = 'none';
      const exec = document.createElement('script');
      exec.textContent = out;
      document.body.appendChild(exec);
    } catch (err) {
      fail('<strong>Dashboard render error.</strong><br><code>' + (err && err.message || err) + '</code>');
    }
  }
})();
</script>

// Override OPERATORS l7 / mtd / apr from live PROD_DAILY — auto-updates every day/month without manual edits.
// apr = last FULL month sum; mtd = last daysElapsed days; l7 = last 7 days.
(() => {
  if (!D.PROD_DAILY) return;
  const _norm = s => (s||'').trim().replace(/\s+/g,' ');
  // Build first-of-month index from DAILY_DATES (same logic as FIRST_OF_MONTH_IDX below, but needed here)
  const _fomi = {};
  DAILY_DATES.forEach((d,i) => { const ym=d.slice(0,6); if(!_fomi[ym]) _fomi[ym]=i; });
  const lastFullYM = MONTHS[LATEST_FULL_MONTH_IDX];
  const nextYM = MONTHS[LATEST_FULL_MONTH_IDX+1];
  const aprStart = _fomi[lastFullYM] !== undefined ? _fomi[lastFullYM] : 0;
  const aprEnd = (nextYM && _fomi[nextYM] !== undefined) ? _fomi[nextYM]-1 : DAILY_EC.length-1;
  OPERATORS.forEach(o => {
    const arr = D.PROD_DAILY[_norm(o.n)];
    if (!arr || !arr.length) return;
    o.l7  = arr.slice(-7).reduce((a,b)=>a+b,0);
    o.mtd = arr.slice(-D.daysElapsed).reduce((a,b)=>a+b,0);
    let aprSum=0;
    for(let i=aprStart;i<=aprEnd&&i<arr.length;i++) aprSum+=(arr[i]||0);
    if(aprSum>0) o.apr=aprSum;
  });
})();

function TrendChartSimple({slices,colors,labels,h=180,compareSlices,compareColors}){
  const W=860,H=h,pl=48,pr=8,pt=8,pb=24,iW=W-pl-pr,iH=H-pt-pb;
  if(!slices||!slices[0]||!slices[0].length)return null;
  // Compute max across primary + comparison so both fit
  const all = compareSlices ? [...slices.flat(), ...compareSlices.flat()] : slices.flat();
  const maxV=Math.max(...all,1);
  const step=iW/(slices[0].length-1||1);
  const nth=Math.ceil(slices[0].length/8);
  const yy=v=>pt+iH-(v/maxV)*iH;
  // Plot helper: arr may be shorter/longer than primary; align to primary's X-step but stop at arr.length
  const mkP=(arr,stepLocal)=>arr.map((v,i)=>`${i===0?"M":"L"}${(pl+i*stepLocal).toFixed(1)},${yy(v||0).toFixed(1)}`).join(" ");
  const ticks=[0,Math.round(maxV*0.5),maxV];
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",overflow:"visible"}}>

    {slices[0].map((_,i)=>i%nth===0&&<text key={"xl"+i} x={pl+i*step} y={H} textAnchor="middle" fontSize={11} fill="#9ca3af">{labels[i]||""}</text>)}
    {compareSlices && compareSlices.map((arr,ki)=>{
      const cStep = arr.length>1 ? iW/(arr.length-1) : iW;
      return <path key={"c"+ki} d={mkP(arr,cStep)} fill="none" stroke={compareColors?compareColors[ki]:"#9ca3af"} strokeWidth={1.5} strokeDasharray="4,3" opacity={0.7}/>;
    })}
    {slices.map((arr,ki)=><path key={"s"+ki} d={mkP(arr,step)} fill="none" stroke={colors[ki]} strokeWidth={2}/>)}</svg>;
}

function ProjectionView(){
  const aprEC=TOTAL_EC[LATEST_FULL_MONTH_IDX]||0;
  const linearProj=Math.round((MTD.ec/MTD.daysElapsed)*MTD.daysInMonth);
  const trailing7Daily=DAILY_EC.slice(-7).reduce((a,b)=>a+b,0)/7;
  const trailing30Daily=DAILY_EC.slice(-30).reduce((a,b)=>a+b,0)/30;
  const trailing90Daily=DAILY_EC.slice(-90).reduce((a,b)=>a+b,0)/90;
  const daysLeft=MTD.daysInMonth - MTD.daysElapsed;
  const recent7Proj=Math.round(MTD.ec + trailing7Daily*daysLeft);
  const recent30Proj=Math.round(MTD.ec + trailing30Daily*daysLeft);
  // Q3 (Jul-Sep) — Jul in books, Aug projecting + Sep estimated at trailing-30 pace
  const q3SepEst = Math.round(trailing30Daily * 30);
  const q3Total = aprEC + linearProj + q3SepEst;            // Jul actual + Aug proj + Sep est
  // Year-end (2026) — Jan-Jul in books + Aug MTD + project Sep-Dec using trailing-30 avg
  const yearSoFar = TOTAL_EC.slice(8, LATEST_FULL_MONTH_IDX + 1).reduce((a,b)=>a+b,0); // Jan26..Jul26
  const remainingDays2026 = (MTD.daysInMonth - MTD.daysElapsed) + 30 + 31 + 30 + 31; // rest of Aug + Sep-Dec
  const yearEndProj = yearSoFar + MTD.ec + Math.round(trailing30Daily*remainingDays2026);
  return <div>
    <div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:12,padding:"1.25rem",marginBottom:"1rem"}}>
      <p style={{margin:"0 0 0.85rem",fontSize:11,fontWeight:500,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.07em"}}>Month-end projections — {MTD.month}</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"0.75rem"}}>
        <div style={{background:"#f0f9ff",borderRadius:10,padding:"0.85rem 1rem",border:"1px solid #bae6fd"}}>
          <div style={{fontSize:10,color:"#075985",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>Linear (MTD pace)</div>
          <div style={{fontSize:24,fontWeight:800,color:"#0369a1"}}>{fN(linearProj)}</div>
          <div style={{fontSize:11,color:"#075985",marginTop:4}}>MTD ÷ days × month days</div>
        </div>
        <div style={{background:"#f0fdf4",borderRadius:10,padding:"0.85rem 1rem",border:"1px solid #bbf7d0"}}>
          <div style={{fontSize:10,color:"#166534",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>Trailing-7 avg</div>
          <div style={{fontSize:24,fontWeight:800,color:"#15803d"}}>{fN(recent7Proj)}</div>
          <div style={{fontSize:11,color:"#166534",marginTop:4}}>MTD + ({trailing7Daily.toFixed(0)}/day × {daysLeft}d)</div>
        </div>
        <div style={{background:"#fef3c7",borderRadius:10,padding:"0.85rem 1rem",border:"1px solid #fde68a"}}>
          <div style={{fontSize:10,color:"#854d0e",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>Trailing-30 avg</div>
          <div style={{fontSize:24,fontWeight:800,color:"#a16207"}}>{fN(recent30Proj)}</div>
          <div style={{fontSize:11,color:"#854d0e",marginTop:4}}>MTD + ({trailing30Daily.toFixed(0)}/day × {daysLeft}d)</div>
        </div>
        <div style={{background:"#f9fafb",borderRadius:10,padding:"0.85rem 1rem"}}>
          <div style={{fontSize:10,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>{ML(MONTHS[LATEST_FULL_MONTH_IDX])} (actual)</div>
          <div style={{fontSize:24,fontWeight:800,color:"#6b7280"}}>{fN(aprEC)}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>reference benchmark</div>
        </div>
      </div>
    </div>
    <div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:12,padding:"1.25rem"}}>
      <p style={{margin:"0 0 0.85rem",fontSize:11,fontWeight:500,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.07em"}}>Longer-horizon forecasts (using trailing-30 avg = {trailing30Daily.toFixed(0)}/day)</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"0.75rem"}}>
        <div style={{background:"#f9fafb",borderRadius:10,padding:"0.85rem 1rem"}}>
          <div style={{fontSize:10,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>Q3 2026 (Jul–Sep)</div>
          <div style={{fontSize:24,fontWeight:800}}>{fN(q3Total)}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>Jul actual · Aug proj · Sep est (t30)</div>
        </div>
        <div style={{background:"#f9fafb",borderRadius:10,padding:"0.85rem 1rem"}}>

          <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>Jan–MTD actual + remainder estimate</div>

      <p style={{margin:"0.75rem 0 0",fontSize:11,color:"#9ca3af",lineHeight:1.5}}>Projections are mechanical extrapolations. They assume no NFL/playoff seasonality, no editorial spikes, and no operator changes. Useful as a floor, not a ceiling.</p>

// ─── COMPARISON ──────────────────────────────────────────────
// Shared presets for date picker (built at runtime since they need DAILY_EC.length)
function buildPresets(){
  const N=DAILY_EC.length;
  // Compute current in-progress month and last full month dynamically from DAILY_DATES.
  // "Current month" = the month YDAY (last day with data) belongs to.
  // "Last full month" = the month immediately prior to the current month.
  const lastYM = DAILY_DATES[N-1].slice(0,6);
  const curStart = (typeof FIRST_OF_MONTH_IDX!=="undefined" && FIRST_OF_MONTH_IDX[lastYM]) || (N-31);
  // Last full month = month before lastYM
  const ly = parseInt(lastYM.slice(0,4)), lm = parseInt(lastYM.slice(4,6));
  const prevY = lm===1 ? ly-1 : ly, prevM = lm===1 ? 12 : lm-1;
  const prevYM = `${prevY}${String(prevM).padStart(2,'0')}`;
  const prevStart = (typeof FIRST_OF_MONTH_IDX!=="undefined" && FIRST_OF_MONTH_IDX[prevYM]) || Math.max(0, curStart-30);
  const prevEnd = curStart - 1;
  const prevLabel = MO[prevM-1] + "'" + String(prevY).slice(2,4); // e.g. "Apr'26"
  return [
    {label:"Last 7d",    start:Math.max(0,N-7),   end:N-1},
    {label:"Last 30d",   start:Math.max(0,N-30),  end:N-1},
    {label:"Last 90d",   start:Math.max(0,N-90),  end:N-1},
    {label:"Last 180d",  start:Math.max(0,N-180), end:N-1},
    {label:"MTD",        start:curStart,           end:N-1},
    {label:prevLabel,    start:Math.max(0,prevStart), end:Math.max(0,prevEnd)},
    {label:"1 yr",       start:Math.max(0,N-365), end:N-1},
    {label:"All",        start:0,                  end:N-1},
  ];
}

// For a daily range, return the inclusive month index range that overlaps (using MONTHS array)
// Handles the case where the picked range extends beyond MONTHS data (e.g. into May 2026).
function monthRangeFromDailyRange(dsi,dei){
  if(dsi<0||dei<0||dsi>=DAILY_DATES.length||dei>=DAILY_DATES.length) return [0,MONTHS.length-1];
  const startYM = DAILY_DATES[dsi].slice(0,6);
  const endYM = DAILY_DATES[dei].slice(0,6);
  // si: first month in MONTHS >= startYM (or last month if startYM is past all of MONTHS)
  let si = MONTHS.findIndex(m => m >= startYM);
  if(si === -1) si = MONTHS.length - 1;
  // ei: last month in MONTHS <= endYM (or first month if endYM is before all of MONTHS)
  let ei = -1;
  for(let i=MONTHS.length-1;i>=0;i--){if(MONTHS[i] <= endYM){ei=i;break;}}
  if(ei === -1) ei = 0;
  if(si > ei) si = ei;
  return [si, ei];
}

  const [si,ei] = monthRangeFromDailyRange(dsi,dei);
  const labels=MONTHS.slice(si,ei+1).map(m=>ML(m));
  const verticalData=useMemo(()=>{const r={};Object.keys(GROUPS).forEach(g=>{r[g]=MONTHS.map((_,mi)=>HOST_KEYS.filter(k=>HOSTS[k].group===g).reduce((a,k)=>a+(HOSTS[k].data[mi]||0),0));});return r;},[]);
  const isOperator = mode==="operator";

  const catDailyTotals = useMemo(()=>{
    if(mode!=="product") return null;

    PRODUCT_KEYS.forEach(k=>r[k]=0);

  const keys=mode==="product"?PRODUCT_KEYS:(mode==="vertical"?Object.keys(GROUPS):[]);

  // For vertical mode: per-vertical daily series built from HOST_DAILY (groups hosts by HOSTS[k].group).

  const verticalDailySeries = useMemo(()=>{
    if(mode!=="vertical") return null;

    series.other=new Array(len).fill(0);

        if(series[info.group]) series[info.group][i-dsi] += (arr[i]||0);
      }

      series.other[i-dsi] = Math.max(0, (DAILY_EC[i]||0) - tracked);

          <span style={{fontSize:10,color:"#9ca3af"}}>{fP(tot,verticalTotals?.all||1)}</span>
          {compareOn && <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#6b7280"}}>
            <span>vs {fN(cmpTot)}</span>
            {d && <span style={{color:d.color,fontWeight:600}}>{d.sign}{d.abs}%</span>}
          </div>}
          {spark&&spark.length>=2&&<MiniLine data={spark} color={color} h={22}/>}
        </button>;
      })}
    </div>}
    {/* Trend chart for Category trend mode (daily series) */}
    {mode==="product" && <div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:12,padding:"1.25rem"}}>
      <p style={{margin:"0 0 0.75rem",fontSize:11,fontWeight:500,color:"#6b7280",textTransform:"uppercase",display:"flex",alignItems:"center",gap:8}}>
        <span>{active==="all"?"All categories":PRODUCTS[active]?.label} — daily affiliate clicks</span>
        {compareOn && <span style={{color:"#9333ea",fontSize:10,fontWeight:600}}>· solid = {fmtFull(dsi)} → {fmtFull(dei)} · dashed = {fmtFull(cmpDsi)} → {fmtFull(cmpDei)}</span>}
      </p>
      {(()=>{
        const slices = active==="all" ? PRODUCT_KEYS.map(k=>catDailySeries?.[k]||[]) : [catDailySeries?.[active]||[]];
        const colors = active==="all" ? PRODUCT_KEYS.map(k=>PRODUCTS[k].color) : [PRODUCTS[active]?.color||"#888"];
        const cmpSlices = compareOn && cmpCatDailySeries ? (active==="all" ? PRODUCT_KEYS.map(k=>cmpCatDailySeries[k]||[]) : [cmpCatDailySeries[active]||[]]) : null;
        const cmpCols = cmpSlices ? colors : null;
        const lbls = [];
        for(let i=0;i<=dei-dsi;i++) lbls.push(DL(DAILY_DATES[dsi+i]));
        return <TrendChartSimple slices={slices} colors={colors} labels={lbls} h={220} compareSlices={cmpSlices} compareColors={cmpCols}/>;
      })()}
    </div>}
    {/* Trend chart for By vertical mode (daily series from HOST_DAILY) */}
    {mode==="vertical" && <div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:12,padding:"1.25rem"}}>
      <p style={{margin:"0 0 0.75rem",fontSize:11,fontWeight:500,color:"#6b7280",textTransform:"uppercase",display:"flex",alignItems:"center",gap:8}}>
        <span>{active==="all"?"All verticals":GROUPS[active]?.label||active} — daily affiliate clicks</span>
        {compareOn && <span style={{color:"#9333ea",fontSize:10,fontWeight:600}}>· solid = {fmtFull(dsi)} → {fmtFull(dei)} · dashed = {fmtFull(cmpDsi)} → {fmtFull(cmpDei)}</span>}
      </p>
      {(()=>{
        const slices = active==="all" ? Object.keys(GROUPS).map(g=>verticalDailySeries?.[g]||[]) : [verticalDailySeries?.[active]||[]];
        const colors = active==="all" ? Object.keys(GROUPS).map(g=>GROUPS[g].color) : [GROUPS[active]?.color||"#888"];
        const cmpSlices = compareOn && cmpVerticalDailySeries ? (active==="all" ? Object.keys(GROUPS).map(g=>cmpVerticalDailySeries[g]||[]) : [cmpVerticalDailySeries[active]||[]]) : null;
        const cmpCols = cmpSlices ? colors : null;
        const lbls = [];
        for(let i=0;i<=dei-dsi;i++) lbls.push(DL(DAILY_DATES[dsi+i]));
        return <TrendChartSimple slices={slices} colors={colors} labels={lbls} h={220} compareSlices={cmpSlices} compareColors={cmpCols}/>;
      })()}
    </div>}
    {mode==="operator" && <OperatorView dsi={dsi} dei={dei}/>}
  </div>;
}
function OperatorView({dsi,dei}){
  const winDays=dei-dsi+1;
  const catWin={};PRODUCT_KEYS.forEach(k=>{catWin[k]=0;});
  OPERATORS.forEach(o=>{const sum=prodSum(o.n,dsi,dei);if(catWin[o.c]!==undefined)catWin[o.c]+=sum;});
  const totalWin=Object.values(catWin).reduce((a,b)=>a+b,0);
  const catMtd={};PRODUCT_KEYS.forEach(k=>{catMtd[k]=0;});
  OPERATORS.forEach(o=>{if(catMtd[o.c]!==undefined)catMtd[o.c]+=o.mtd;});
  const totalMtd=Object.values(catMtd).reduce((a,b)=>a+b,0);
  const catProj={};PRODUCT_KEYS.forEach(k=>{catProj[k]=Math.round((catMtd[k]||0)/MTD.daysElapsed*MTD.daysInMonth);});
  const totalProj=Math.round(totalMtd/MTD.daysElapsed*MTD.daysInMonth);
  const catApr={};PRODUCT_KEYS.forEach(k=>{catApr[k]=PRODUCTS[k].data[LATEST_FULL_MONTH_IDX]||0;});
  const totalApr=Object.values(catApr).reduce((a,b)=>a+b,0);
  const aprMon=MO[parseInt(MONTHS[LATEST_FULL_MONTH_IDX].slice(4))-1];
  const catT30={};PRODUCT_KEYS.forEach(k=>{catT30[k]=0;});
  OPERATORS.forEach(o=>{const arr=PROD_DAILY[o.n];if(!arr)return;const s=arr.slice(-30).reduce((a,b)=>a+b,0);if(catT30[o.c]!==undefined)catT30[o.c]+=s/30;});
  const totalT30=Object.values(catT30).reduce((a,b)=>a+b,0);
  const catNxt={};PRODUCT_KEYS.forEach(k=>{catNxt[k]=Math.round(catT30[k]*30);});
  const totalNxt=Math.round(totalT30*30);
  const curMon=ML(MONTHS[MONTHS.length-1]);
  const nxtMon=MO[parseInt(MONTHS[MONTHS.length-1].slice(4))%12];
  const pctChip=(proj,apr)=>{if(!apr)return null;const v=(proj-apr)/apr*100;const pos=v>=0;return <span style={{fontSize:10,fontWeight:600,padding:"1px 6px",borderRadius:99,background:pos?"#f0fdf4":"#fef2f2",color:pos?"#15803d":"#b91c1c"}}>{(pos?"+":"")+v.toFixed(1)+"%"}</span>;};
  const allCats=[["all","All Products","#888780",totalWin,totalMtd,totalProj,totalApr,totalNxt],...PRODUCT_KEYS.map(k=>[k,PRODUCTS[k].label,PRODUCTS[k].color,catWin[k],catMtd[k],catProj[k],catApr[k],catNxt[k]])];
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(195px,1fr))",gap:8,marginBottom:"1.25rem"}}>
      {allCats.map(([key,label,color,win,mtd,proj,apr,nxt])=>(
        <div key={key} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:10,padding:"0.75rem 0.9rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:color,flexShrink:0}}/>
            <span style={{fontSize:10,fontWeight:600,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</span>
          </div>
          <div style={{fontSize:22,fontWeight:700,color:"#111",lineHeight:1.1}}>{fN(win)}</div>
          <div style={{fontSize:10,color:"#9ca3af",marginBottom:6}}>{winDays}d window · {win>0?Math.round(win/winDays):0}/day</div>
          <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginBottom:2}}>
            <span style={{fontSize:11,color:"#6b7280"}}>MTD {fN(mtd)} · proj {curMon} {fN(proj)}</span>
            {pctChip(proj,apr)}
          </div>
          <div style={{fontSize:10,color:"#9ca3af"}}>{aprMon} {fN(apr)} · {curMon.split("'")[0]} {fN(proj)} · {nxtMon} {fN(nxt)}</div>
        </div>
      ))}
    </div>
    <div style={{background:"linear-gradient(135deg,#fef3c7 0%,#fffbeb 100%)",border:"2px solid #fbbf24",borderRadius:14,padding:"1rem 1.25rem",marginBottom:"1rem"}}>
      <div style={{fontSize:11,fontWeight:700,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"0.75rem"}}>
        Current month projection — {MTD.month} (end of month)
        <span style={{fontWeight:400,color:"#a16207",marginLeft:8,textTransform:"none"}}>linear MTD-pace, {MTD.daysElapsed}/{MTD.daysInMonth} days elapsed</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(175px,1fr))",gap:8}}>
        {allCats.map(([key,label,color,win,mtd,proj,apr])=>(
          <div key={key} style={{background:"white",borderRadius:10,padding:"0.65rem 0.85rem",border:"1px solid #fde68a"}}>
            <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:color,flexShrink:0}}/>
              <span style={{fontSize:10,fontWeight:600,color:"#92400e",textTransform:"uppercase"}}>{label}</span>
            </div>
            <div style={{fontSize:22,fontWeight:700,color,lineHeight:1.1}}>{fN(proj)}</div>
            <div style={{display:"flex",alignItems:"center",gap:4,marginTop:3,flexWrap:"wrap"}}>
              <span style={{fontSize:10,color:"#6b7280"}}>MTD {fN(mtd)} · {aprMon} {fN(apr)}</span>
              {pctChip(proj,apr)}
            </div>
          </div>
        ))}
      </div>
    </div>
    <div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:12,padding:"1.25rem"}}>
      <p style={{margin:"0 0 0.75rem",fontSize:11,fontWeight:500,color:"#6b7280",textTransform:"uppercase",letterSpacing:"0.07em"}}>By product — last 7d / MTD / {ML(MONTHS[LATEST_FULL_MONTH_IDX])} (full month)</p>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr style={{borderBottom:"1px solid #e5e7eb"}}>{["Product","Cat","Last 7d","MTD",ML(MONTHS[LATEST_FULL_MONTH_IDX]),"Proj","vs"].map((h,i)=>(<th key={i} style={{padding:"5px 8px",textAlign:i<2?"left":"right",color:"#6b7280",fontSize:10,fontWeight:500}}>{h}</th>))}</tr></thead>
        <tbody>{OPERATORS.filter(o=>o.l7>0||o.mtd>0||o.apr>0).map((o,i)=>{const cat=PRODUCTS[o.c]||{label:o.c,color:"#888"};const proj=o.mtd>0?Math.round(o.mtd/MTD.daysElapsed*MTD.daysInMonth):0;const vs=o.apr>0?((proj-o.apr)/o.apr*100):null;return <tr key={i} style={{borderBottom:"1px solid #f9fafb"}}><td style={{padding:"5px 8px",fontWeight:500}}>{o.n}</td><td style={{padding:"5px 8px"}}><span style={{fontSize:10,padding:"1px 5px",borderRadius:99,background:cat.color+"22",color:cat.color,fontWeight:600}}>{cat.label}</span></td><td style={{padding:"5px 8px",textAlign:"right",color:o.l7>0?"#111":"#d1d5db"}}>{o.l7>0?fN(o.l7):"--"}</td><td style={{padding:"5px 8px",textAlign:"right",color:o.mtd>0?"#111":"#d1d5db"}}>{o.mtd>0?fN(o.mtd):"--"}</td><td style={{padding:"5px 8px",textAlign:"right",color:o.apr>0?"#111":"#d1d5db"}}>{o.apr>0?fN(o.apr):"--"}</td><td style={{padding:"5px 8px",textAlign:"right",fontWeight:600,color:"#D85A30"}}>{o.mtd>0?fN(proj):"--"}</td><td style={{padding:"5px 8px",textAlign:"right"}}><PctBadge pct={vs}/></td></tr>;})}
        </tbody></table></div>
    </div>
  </div>;
}
function prodSum(name,si,ei){const arr=PROD_DAILY[name];if(!arr)return 0;let t=0;for(let i=si;i<=ei&&i<arr.length;i++)t+=(arr[i]||0);return t;}
const FIRST_OF_MONTH_IDX=(()=>{const r={};DAILY_DATES.forEach((d,i)=>{const ym=d.slice(0,6);if(!r[ym])r[ym]=i;});return r;})();
function fmtFull(di){const d=DAILY_DATES[di];return d?MO[parseInt(d.slice(4,6))-1]+" "+parseInt(d.slice(6,8))+" '"+d.slice(2,4):"";}
function DateRangePicker({dsi,dei,onChange,presets}){
  return <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
    {presets.map(p=>{const a=dsi===p.start&&dei===p.end;return <button key={p.label} onClick={()=>onChange(p.start,p.end)} style={{...btnStyle(a),fontSize:11}}>{p.label}</button>;})}
  </div>;
}
function App(){
  const [tab,setTab]=useState("rollup");
  const stamp=`✓ Live GA4 data · as of ${DATA_AS_OF} · refreshes on each page load`;
  return <div>
    <div className="stamp">{stamp}</div>
    <div style={{fontSize:11,color:"#9ca3af",textAlign:"right",marginBottom:"0.5rem"}}>Data current as of {DATA_AS_OF} · GA4 property 406717704 · event affiliate_click · product = customEvent:product</div>
    <div style={{display:"flex",borderBottom:"2px solid #e5e7eb",marginBottom:"1.5rem"}}>
      {[["rollup","Rollup"],["subsites","Subsites"],["comparison","Comparison"]].map(([k,l])=>{const a=tab===k;return <button key={k} onClick={()=>setTab(k)} style={{background:"none",border:"none",borderBottom:a?"3px solid #111":"3px solid transparent",marginBottom:-2,padding:"10px 20px",fontSize:15,fontWeight:a?700:400,color:a?"#111":"#6b7280",cursor:"pointer"}}>{l}</button>;})}
    </div>
    {tab==="rollup"&&<RollupTab/>}
    {tab==="subsites"&&<SubsitesTab/>}
    {tab==="comparison"&&<ComparisonTab/>}
  </div>;
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
