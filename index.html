function PctBadge({pct,label}){
  if(pct===null||pct===undefined)return <span style={{fontSize:11,color:"#9ca3af"}}>--</span>;
  const pos=pct>=0;
  return <span style={{fontSize:11,fontWeight:500,padding:"2px 7px",borderRadius:99,background:pos?"#f0fdf4":"#fef2f2",color:pos?"#15803d":"#b91c1c"}}>{(pos?"+":"")+pct.toFixed(1)+"%"}{label?" "+label:""}</span>;
}
const btnStyle=a=>({fontSize:11,padding:"3px 10px",borderRadius:6,border:"1px solid #e5e7eb",cursor:"pointer",background:a?"#eff6ff":"transparent",color:a?"#1d4ed8":"#6b7280",fontWeight:a?500:400});
function MiniLine({data,color,h=26}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data,1),W=200,H=h,step=W/(data.length-1||1);
  const pts=data.map((v,i)=>`${(i*step).toFixed(1)},${(H-2-(v/max)*(H-4)).toFixed(1)}`).join(" ");
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:h,overflow:"hidden"}}><polyline points={pts} fill="none" stroke={color} strokeWidth={1.6}/></svg>;
}
function GranToggle({value,onChange}){
  const opt=(k,l)=>{const a=value===k;return <button key={k} onClick={()=>onChange(k)} style={{flex:1,padding:"14px 24px",fontSize:15,fontWeight:a?700:500,border:a?"2px solid #111827":"2px solid #e5e7eb",background:a?"#111827":"white",color:a?"white":"#6b7280",borderRadius:10,cursor:"pointer"}}>{l}</button>;};
  return <div style={{display:"flex",gap:8,marginBottom:"1.25rem"}}>{opt("monthly","Monthly")}{opt("daily","Daily")}</div>;
}
function RecentActivity(){
  const aprEC=TOTAL_EC[LATEST_FULL_MONTH_IDX]||0,aprSess=TOTAL_SESS[LATEST_FULL_MONTH_IDX]||0;
  const aprYM=MONTHS[LATEST_FULL_MONTH_IDX];

  const aprDays=new Date(parseInt(aprYM.slice(0,4)),parseInt(aprYM.slice(4,6)),0).getDate();
  const wow=LAST7.prevEc>0?((LAST7.ec-LAST7.prevEc)/LAST7.prevEc*100):null;
  const mtdProj=Math.round((MTD.ec/MTD.daysElapsed)*MTD.daysInMonth);
  const mtdVsApr=aprEC>0?((mtdProj-aprEC)/aprEC*100):null;

      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"0.75rem"}}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>

          <div style={{fontSize:26,fontWeight:800,color:"#D85A30",lineHeight:1}}>{fN(LAST7.ec)}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>{(LAST7.ec/7).toFixed(0)}/day · CR {fP(LAST7.ec,LAST7.sessions)}</div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:600,color:"#92400e",textTransform:"uppercase"}}>MTD</div>
            <PctBadge pct={mtdVsApr} label={`proj vs ${aprMon}`}/>
          </div>
          <div style={{fontSize:26,fontWeight:800,color:"#D85A30",lineHeight:1}}>{fN(MTD.ec)}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>proj {fN(mtdProj)} · {(MTD.ec/MTD.daysElapsed).toFixed(0)}/day</div>
          <div style={{background:"#f3f4f6",borderRadius:99,height:5,overflow:"hidden",marginTop:6}}>

function MonthlyChart({si,ei,h=220}){
  const ec=TOTAL_EC.slice(si,ei+1),sess=TOTAL_SESS.slice(si,ei+1),labels=MONTHS.slice(si,ei+1).map(m=>ML(m));
  const W=880,H=h,pl=58,pr=58,pt=8,pb=28,iW=W-pl-pr,iH=H-pt-pb;
  if(!ec.length)return null;
  const lmax=Math.max(...sess,1),rmax=Math.max(...ec,1);
  const yl=v=>pt+iH-(v/lmax)*iH,yr=v=>pt+iH-(v/rmax)*iH;
  const step=iW/(ec.length-1||1),nth=Math.ceil(ec.length/8);
  const mkP=(arr,fn)=>arr.map((v,i)=>`${i===0?"M":"L"}${(pl+i*step).toFixed(1)},${fn(v||0).toFixed(1)}`).join(" ");
  const ticks=[0,Math.round(lmax*0.5),lmax];
  const fmt=t=>t>=1e6?(t/1e6).toFixed(1)+"M":t>=1000?(t/1000).toFixed(0)+"K":""+t;
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",overflow:"visible"}}>
    {ticks.map(t=>[<line key={"g"+t} x1={pl} x2={pl+iW} y1={yl(t)} y2={yl(t)} stroke="#f3f4f6" strokeWidth={0.7}/>,<text key={"lt"+t} x={pl-6} y={yl(t)+4} textAnchor="end" fontSize={10} fill="#378ADD">{fmt(t)}</text>])}
    {[Math.round(rmax*0.5),rmax].map(t=>(<text key={"rt"+t} x={pl+iW+6} y={yr(t)+4} textAnchor="start" fontSize={10} fill="#D85A30">{fmt(t)}</text>))}
    {ec.map((_,i)=>i%nth===0&&<text key={"xl"+i} x={pl+i*step} y={H-4} textAnchor="middle" fontSize={10} fill="#9ca3af">{labels[i]||""}</text>)}
    <path d={mkP(sess,yl)} fill="none" stroke="#378ADD" strokeWidth={2}/><path d={mkP(ec,yr)} fill="none" stroke="#D85A30" strokeWidth={2.5}/></svg>;
}

  const lmax=Math.max(...sess,1),rmax=Math.max(...ec,1);
  const yl=v=>pt+iH-(v/lmax)*iH,yr=v=>pt+iH-(v/rmax)*iH;
  const step=iW/(ec.length-1||1),nth=Math.max(1,Math.ceil(ec.length/10));
  const mkP=(arr,fn)=>arr.map((v,i)=>`${i===0?"M":"L"}${(pl+i*step).toFixed(1)},${fn(v||0).toFixed(1)}`).join(" ");
  const ticks=[0,Math.round(lmax*0.5),lmax];
  const fmt=t=>t>=1e6?(t/1e6).toFixed(1)+"M":t>=1000?(t/1000).toFixed(1)+"K":""+t;
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",overflow:"visible"}}>
    {ticks.map(t=>[<line key={"g"+t} x1={pl} x2={pl+iW} y1={yl(t)} y2={yl(t)} stroke="#f3f4f6" strokeWidth={0.7}/>,<text key={"lt"+t} x={pl-6} y={yl(t)+4} textAnchor="end" fontSize={10} fill="#378ADD">{fmt(t)}</text>])}
    {[Math.round(rmax*0.5),rmax].map(t=>(<text key={"rt"+t} x={pl+iW+6} y={yr(t)+4} textAnchor="start" fontSize={10} fill="#D85A30">{fmt(t)}</text>))}
    {ec.map((_,i)=>i%nth===0&&<text key={"xl"+i} x={pl+i*step} y={H-4} textAnchor="middle" fontSize={10} fill="#9ca3af">{DL(DAILY_DATES[dsi+i])}</text>)}
    <path d={mkP(sess,yl)} fill="none" stroke="#378ADD" strokeWidth={1.5}/><path d={mkP(ec,yr)} fill="none" stroke="#D85A30" strokeWidth={1.8}/></svg>;
}
function TrendChartSimple({slices,colors,labels,h=180,compareSlices,compareColors}){
  const W=860,H=h,pl=48,pr=8,pt=8,pb=24,iW=W-pl-pr,iH=H-pt-pb;
  if(!slices||!slices[0]||!slices[0].length)return null;
  // Compute max across primary + comparison so both fit
  const all = compareSlices ? [...slices.flat(), ...compareSlices.flat()] : slices.flat();
  const maxV=Math.max(...all,1);
  const step=iW/(slices[0].length-1||1);
  const nth=Math.ceil(slices[0].length/8);
  const yy=v=>pt+iH-(v/maxV)*iH;
  // Plot helper: arr may be shorter/longer than primary; align to primary's X-step but stop at arr.length
  const mkP=(arr,stepLocal)=>arr.map((v,i)=>`${i===0?"M":"L"}${(pl+i*stepLocal).toFixed(1)},${yy(v||0).toFixed(1)}`).join(" ");
  const ticks=[0,Math.round(maxV*0.5),maxV];
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",overflow:"visible"}}>
    {ticks.map(t=>[<line key={"g"+t} x1={pl} x2={pl+iW} y1={yy(t)} y2={yy(t)} stroke="#e5e7eb" strokeWidth={0.5}/>,<text key={"tl"+t} x={pl-6} y={yy(t)+4} textAnchor="end" fontSize={11} fill="#9ca3af">{t>=1000?(t/1000).toFixed(0)+"K":""+t}</text>])}
    {slices[0].map((_,i)=>i%nth===0&&<text key={"xl"+i} x={pl+i*step} y={H} textAnchor="middle" fontSize={11} fill="#9ca3af">{labels[i]||""}</text>)}
    {compareSlices && compareSlices.map((arr,ki)=>{
      const cStep = arr.length>1 ? iW/(arr.length-1) : iW;
      return <path key={"c"+ki} d={mkP(arr,cStep)} fill="none" stroke={compareColors?compareColors[ki]:"#9ca3af"} strokeWidth={1.5} strokeDasharray="4,3" opacity={0.7}/>;
    })}
    {slices.map((arr,ki)=><path key={"s"+ki} d={mkP(arr,step)} fill="none" stroke={colors[ki]} strokeWidth={2}/>)}</svg>;
}

// Shared presets for date picker (built at runtime since they need DAILY_EC.length)
function buildPresets(){
  const N=DAILY_EC.length;
  // Compute current in-progress month and last full month dynamically from DAILY_DATES.
  // "Current month" = the month YDAY (last day with data) belongs to.
  // "Last full month" = the month immediately prior to the current month.
  const lastYM = DAILY_DATES[N-1].slice(0,6);
  const curStart = (typeof FIRST_OF_MONTH_IDX!=="undefined" && FIRST_OF_MONTH_IDX[lastYM]) || (N-31);
  // Last full month = month before lastYM
  const ly = parseInt(lastYM.slice(0,4)), lm = parseInt(lastYM.slice(4,6));
  const prevY = lm===1 ? ly-1 : ly, prevM = lm===1 ? 12 : lm-1;
  const prevYM = `${prevY}${String(prevM).padStart(2,'0')}`;
  const prevStart = (typeof FIRST_OF_MONTH_IDX!=="undefined" && FIRST_OF_MONTH_IDX[prevYM]) || Math.max(0, curStart-30);
  const prevEnd = curStart - 1;
  const prevLabel = MO[prevM-1] + "'" + String(prevY).slice(2,4); // e.g. "Apr'26"
  return [
    {label:"Last 7d",    start:Math.max(0,N-7),   end:N-1},
    {label:"Last 30d",   start:Math.max(0,N-30),  end:N-1},
    {label:"Last 90d",   start:Math.max(0,N-90),  end:N-1},
    {label:"Last 180d",  start:Math.max(0,N-180), end:N-1},
    {label:"MTD",        start:curStart,           end:N-1},
    {label:prevLabel,    start:Math.max(0,prevStart), end:Math.max(0,prevEnd)},
    {label:"1 yr",       start:Math.max(0,N-365), end:N-1},
    {label:"All",        start:0,                  end:N-1},
  ];
}

// For a daily range, return the inclusive month index range that overlaps (using MONTHS array)
// Handles the case where the picked range extends beyond MONTHS data (e.g. into May 2026).
function monthRangeFromDailyRange(dsi,dei){
  if(dsi<0||dei<0||dsi>=DAILY_DATES.length||dei>=DAILY_DATES.length) return [0,MONTHS.length-1];
  const startYM = DAILY_DATES[dsi].slice(0,6);
  const endYM = DAILY_DATES[dei].slice(0,6);
  // si: first month in MONTHS >= startYM (or last month if startYM is past all of MONTHS)
  let si = MONTHS.findIndex(m => m >= startYM);
  if(si === -1) si = MONTHS.length - 1;
  // ei: last month in MONTHS <= endYM (or first month if endYM is before all of MONTHS)
  let ei = -1;
  for(let i=MONTHS.length-1;i>=0;i--){if(MONTHS[i] <= endYM){ei=i;break;}}
  if(ei === -1) ei = 0;
  if(si > ei) si = ei;
  return [si, ei];
}

  const [compareOn,setCompareOn]=useState(false);
  const defaultCmpEnd = Math.max(0, dsi-1);
  const defaultCmpStart = Math.max(0, defaultCmpEnd - (dei-dsi));
  const [cmpDsi,setCmpDsi]=useState(defaultCmpStart);
  const [cmpDei,setCmpDei]=useState(defaultCmpEnd);
  const winDays = dei-dsi+1;
  const cmpWinDays = cmpDei-cmpDsi+1;
  const [si,ei] = monthRangeFromDailyRange(dsi,dei);
  const labels=MONTHS.slice(si,ei+1).map(m=>ML(m));
  const verticalData=useMemo(()=>{const r={};Object.keys(GROUPS).forEach(g=>{r[g]=MONTHS.map((_,mi)=>HOST_KEYS.filter(k=>HOSTS[k].group===g).reduce((a,k)=>a+(HOSTS[k].data[mi]||0),0));});return r;},[]);
  const isOperator = mode==="operator";

  // For Category trend: aggregate PROD_DAILY into per-category daily totals across the picked window
  const catDailyTotals = useMemo(()=>{
    if(mode!=="product") return null;
    const r={};
    PRODUCT_KEYS.forEach(k=>r[k]=0);
    OPERATORS.forEach(o=>{
      const sum = prodSum(o.n, dsi, dei);
      if(r[o.c]!==undefined) r[o.c]+=sum;
    });
    return r;
  },[mode,dsi,dei]);
  // For chart: per-category daily series (downsampled to daily) — pass through PROD_DAILY agg
  const catDailySeries = useMemo(()=>{
    if(mode!=="product") return null;
    const series={};
    PRODUCT_KEYS.forEach(k=>{series[k]=new Array(dei-dsi+1).fill(0);});
    OPERATORS.forEach(o=>{
      const arr = PROD_DAILY[o.n]; if(!arr) return;
      for(let i=dsi;i<=dei;i++){
        if(series[o.c]) series[o.c][i-dsi]+=(arr[i]||0);
      }
    });
    return series;
  },[mode,dsi,dei]);

  const keys=mode==="product"?PRODUCT_KEYS:(mode==="vertical"?Object.keys(GROUPS):[]);
  const info=mode==="product"?PRODUCTS:GROUPS;
  const data=mode==="product"?Object.fromEntries(PRODUCT_KEYS.map(k=>[k,PRODUCTS[k].data])):verticalData;
  // For vertical mode: per-vertical daily series built from HOST_DAILY (groups hosts by HOSTS[k].group).
  // "all" = total affiliate clicks in window (from DAILY_EC, authoritative). "other" = residual
  // (clicks from hosts not tracked in HOST_DAILY — only 20 hosts are tracked).
  const verticalDailySeries = useMemo(()=>{
    if(mode!=="vertical") return null;
    const len = dei-dsi+1;
    const series={}; Object.keys(GROUPS).forEach(g=>series[g]=new Array(len).fill(0));
    series.other=new Array(len).fill(0);
    HOST_KEYS.forEach(k => {
      const info = HOSTS[k];
      const arr = HOST_DAILY[info.host];
      if(!arr) return;
      for(let i=dsi; i<=dei && i<arr.length; i++){
        if(series[info.group]) series[info.group][i-dsi] += (arr[i]||0);
      }
    });
    // "other" = DAILY_EC[i] - sum(tracked verticals at i)
    for(let i=dsi;i<=dei;i++){
      const tracked = Object.keys(GROUPS).reduce((a,g)=>a+series[g][i-dsi],0);
      series.other[i-dsi] = Math.max(0, (DAILY_EC[i]||0) - tracked);
    }
    return series;
  },[mode,dsi,dei]);
  const verticalTotals = useMemo(()=>{
    if(mode!=="vertical" || !verticalDailySeries) return null;
    const r={};
    Object.keys(GROUPS).forEach(g=>r[g]=verticalDailySeries[g].reduce((a,b)=>a+b,0));
    r.other = verticalDailySeries.other.reduce((a,b)=>a+b,0);
    // ALL = sum of DAILY_EC in the window (authoritative total)
    let total=0; for(let i=dsi;i<=dei;i++) total += (DAILY_EC[i]||0);
    r.all = total;
    return r;
  },[mode,dsi,dei,verticalDailySeries]);

  // Comparison-period totals (computed only when compareOn). Same shape as verticalTotals/catDailyTotals.
  const cmpVerticalTotals = useMemo(()=>{
    if(!compareOn || mode!=="vertical") return null;
    const r={}; Object.keys(GROUPS).forEach(g=>r[g]=0); r.other=0;
    HOST_KEYS.forEach(k=>{
      const info=HOSTS[k]; const arr=HOST_DAILY[info.host]; if(!arr) return;

    r.all=all;
    const tracked=Object.keys(GROUPS).reduce((a,g)=>a+r[g],0);

      const tracked=Object.keys(GROUPS).reduce((a,g)=>a+series[g][i-cmpDsi],0);

    });

  },[compareOn,mode,cmpDsi,cmpDei]);

// Days remaining in the current month (Jun 2026 = 30 days)
let MAY_DAYS = 31;
let MAY_DAYS_ELAPSED = 1;
// Find indices in DAILY_DATES for the start of months we care about
let FIRST_OF_MONTH_IDX = (()=>{
  const r={};
  DAILY_DATES.forEach((d,i)=>{const ym=d.slice(0,6);if(!(ym in r)) r[ym]=i;});
  return r;
})();

// Compute clicks for a single product in [dsi, dei] inclusive
function prodSum(prodName, dsi, dei){
  const arr = PROD_DAILY[prodName];
  if(!arr) return 0;
  let t=0; for(let i=dsi;i<=dei;i++) t+=arr[i]||0;
  return t;
}

// ─── GA-style date range picker ──────────────────────────────────────────────
// Helper: index in DAILY_DATES → JS Date
function idxToDate(i){const s=DAILY_DATES[i];return new Date(parseInt(s.slice(0,4)),parseInt(s.slice(4,6))-1,parseInt(s.slice(6,8)));}
function dateToIdx(d){const ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;return DAILY_DATES.indexOf(ymd);}
function fmtFull(i){if(i<0||i>=DAILY_DATES.length)return"";const d=idxToDate(i);return `${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function monthGrid(y,m){
  // Returns array of 42 cells (6 weeks × 7 days). Each cell = {date: Date, idx: int|null, inMonth: bool}
  const first = new Date(y,m,1);
  const startDow = first.getDay();  // 0=Sun
  const dim = daysInMonth(y,m);
  const cells = [];
  // Previous month tail
  const prevDim = daysInMonth(y, m-1);
  for(let i=startDow-1;i>=0;i--){
    const d=new Date(y,m-1,prevDim-i);
    cells.push({date:d, idx:dateToIdx(d), inMonth:false});
  }
  // This month
  for(let day=1;day<=dim;day++){
    const d=new Date(y,m,day);
    cells.push({date:d, idx:dateToIdx(d), inMonth:true});
  }
  // Next month head to fill 42
  let nd=1;
  while(cells.length<42){
    const d=new Date(y,m+1,nd++);
    cells.push({date:d, idx:dateToIdx(d), inMonth:false});
  }
  return cells;
}

function DateRangePicker({dsi,dei,onChange,presets}){
  const [open,setOpen]=useState(false);
  const [tStart,setTStart]=useState(dsi);
  const [tEnd,setTEnd]=useState(dei);
  const [hover,setHover]=useState(null);
  const [picking,setPicking]=useState("end");  // "start" or "end"
  // Left calendar viewing year/month — default to month of dei
  const initDate=idxToDate(dei);
  const [viewY,setViewY]=useState(initDate.getFullYear());
  const [viewM,setViewM]=useState(initDate.getMonth());

  // When opening, reset temp range to committed values
  function toggle(){
    if(!open){setTStart(dsi);setTEnd(dei);setPicking("start");}
    setOpen(!open);
  }
  function apply(){
    const a=Math.min(tStart,tEnd), b=Math.max(tStart,tEnd);
    onChange(a,b); setOpen(false);
  }
  function cancel(){setOpen(false);}
  function applyPreset(p){
    setTStart(p.start); setTEnd(p.end);
    const d=idxToDate(p.end); setViewY(d.getFullYear()); setViewM(d.getMonth());
  }
  function handleDayClick(idx){
    if(idx===null||idx<0)return;
    if(picking==="start"){setTStart(idx);setTEnd(idx);setPicking("end");}
    else{
      if(idx<tStart){setTEnd(tStart);setTStart(idx);}
      else setTEnd(idx);
      setPicking("start");
    }
  }
  function navMonth(delta){
    let y=viewY, m=viewM+delta;
    while(m<0){m+=12;y--;} while(m>11){m-=12;y++;}
    setViewY(y); setViewM(m);
  }
  // For range hover preview
  const rangeStart=Math.min(tStart,tEnd);
  const rangeEnd=Math.max(tStart,tEnd);
  const hoverStart = (picking==="end" && hover!==null) ? Math.min(tStart,hover) : null;
  const hoverEnd   = (picking==="end" && hover!==null) ? Math.max(tStart,hover) : null;
  function cellStyle(cell){
    const i=cell.idx;
    const inRange = i!==null && i>=rangeStart && i<=rangeEnd;
    const inHover = hoverStart!==null && i!==null && i>=hoverStart && i<=hoverEnd;
    const isStart = i===rangeStart && i!==null;
    const isEnd = i===rangeEnd && i!==null;
    const isToday = i===DAILY_EC.length-1;
    return {
      width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:12, cursor:i!==null?"pointer":"default",
      color: !cell.inMonth ? "#d1d5db" : (isStart||isEnd ? "white" : inRange ? "#1d4ed8" : "#111"),
      background: (isStart||isEnd) ? "#2563eb" : (inRange||inHover) ? "#dbeafe" : "transparent",
      borderRadius: (isStart||isEnd) ? "50%" : 0,
      fontWeight: isStart||isEnd||isToday ? 600 : 400,
      border: isToday && !(isStart||isEnd) ? "1px solid #2563eb" : "1px solid transparent",
    };
  }
  function MonthCalendar({y,m}){
    const cells=monthGrid(y,m);
    return <div style={{display:"flex",flexDirection:"column",gap:2}}>
      <div style={{textAlign:"center",fontSize:13,fontWeight:600,marginBottom:6,color:"#111"}}>{MO[m]} {y}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1}}>
        {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,color:"#9ca3af",padding:"4px 0"}}>{d}</div>)}
        {cells.map((cell,i)=>{
          const s=cellStyle(cell);
          return <div key={i}
            onClick={()=>cell.inMonth&&handleDayClick(cell.idx)}
            onMouseEnter={()=>cell.inMonth&&cell.idx!==null&&setHover(cell.idx)}
            onMouseLeave={()=>setHover(null)}
            style={s}>{cell.date.getDate()}</div>;
        })}
      </div>
    </div>;
  }

  const triggerLabel = `${fmtFull(dsi)}  →  ${fmtFull(dei)}`;

  return <div style={{position:"relative",display:"inline-block"}}>
    <button onClick={toggle} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",border:"1px solid #d1d5db",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,minWidth:280}}>
      <span style={{fontSize:14}}>📅</span>
      <span style={{color:"#111",fontWeight:500}}>{triggerLabel}</span>
      <span style={{marginLeft:"auto",color:"#9ca3af"}}>▾</span>
    </button>
    {open && <>
      <div onClick={cancel} style={{position:"fixed",inset:0,zIndex:50,background:"transparent"}}/>
      <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:51,background:"white",border:"1px solid #e5e7eb",borderRadius:12,boxShadow:"0 10px 25px rgba(0,0,0,0.12)",padding:"1rem",display:"flex",gap:"1.25rem",minWidth:640}}>
        {/* Presets sidebar */}
        <div style={{display:"flex",flexDirection:"column",gap:4,borderRight:"1px solid #f3f4f6",paddingRight:"1rem",minWidth:130}}>
          <div style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4,fontWeight:500}}>Quick ranges</div>
          {presets.map(p=>{const active=tStart===p.start&&tEnd===p.end;return <button key={p.label} onClick={()=>applyPreset(p)} style={{padding:"6px 10px",fontSize:12,textAlign:"left",border:"none",borderRadius:6,background:active?"#eff6ff":"transparent",color:active?"#1d4ed8":"#374151",cursor:"pointer",fontWeight:active?500:400}}>{p.label}</button>;})}
        </div>
        {/* Calendar pair */}
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <button onClick={()=>navMonth(-1)} style={{background:"transparent",border:"1px solid #e5e7eb",borderRadius:6,width:28,height:28,cursor:"pointer",fontSize:14}}>◀</button>
            <div style={{display:"flex",gap:8,fontSize:11,color:"#6b7280"}}>
              <span><strong style={{color:"#111"}}>{fmtFull(tStart)}</strong></span>
              <span>→</span>
              <span><strong style={{color:"#111"}}>{fmtFull(tEnd)}</strong></span>
              <span style={{color:"#9ca3af"}}>· {Math.abs(tEnd-tStart)+1} days</span>
            </div>
            <button onClick={()=>navMonth(1)} style={{background:"transparent",border:"1px solid #e5e7eb",borderRadius:6,width:28,height:28,cursor:"pointer",fontSize:14}}>▶</button>
          </div>
          <div style={{display:"flex",gap:"1.5rem"}}>
            <MonthCalendar y={viewY} m={viewM}/>
            <MonthCalendar y={viewM===11?viewY+1:viewY} m={(viewM+1)%12}/>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:12,borderTop:"1px solid #f3f4f6",paddingTop:10}}>
            <button onClick={cancel} style={{padding:"6px 14px",fontSize:12,border:"1px solid #e5e7eb",background:"white",color:"#374151",borderRadius:6,cursor:"pointer"}}>Cancel</button>
            <button onClick={apply} style={{padding:"6px 14px",fontSize:12,border:"none",background:"#2563eb",color:"white",borderRadius:6,cursor:"pointer",fontWeight:500}}>Apply</button>
          </div>
        </div>
      </div>
    </>}
  </div>;
}

function OperatorView({opFilter,setOpFilter,dsi,dei,setDsi,setDei,presets}){
  // Current/prior/next month keys derived from the latest daily data point — never hardcoded,
  // so this view automatically advances every month instead of freezing on a fixed month.
  const curYM = DAILY_DATES[DAILY_DATES.length-1].slice(0,6);
  const shiftYM = (ym, delta) => { let y=parseInt(ym.slice(0,4)), m=parseInt(ym.slice(4,6))+delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}${String(m).padStart(2,'0')}`; };
  const daysInYM = (ym) => new Date(parseInt(ym.slice(0,4)), parseInt(ym.slice(4,6)), 0).getDate();
  const priorYM = shiftYM(curYM,-1), next1YM = shiftYM(curYM,1), next2YM = shiftYM(curYM,2);
  const curMon = MO[parseInt(curYM.slice(4))-1], priorMon = MO[parseInt(priorYM.slice(4))-1];
  const next1Mon = MO[parseInt(next1YM.slice(4))-1], next2Mon = MO[parseInt(next2YM.slice(4))-1];

  // Window state lifted to parent; we still derive month-boundary indexes for MTD/prior-month columns
  const mtdStart = FIRST_OF_MONTH_IDX[curYM] ?? (DAILY_EC.length - MAY_DAYS_ELAPSED);
  const aprStart = FIRST_OF_MONTH_IDX[priorYM] ?? (DAILY_EC.length - MAY_DAYS_ELAPSED - 31);
  const [sortBy, setSortBy] = useState("proj");  // "proj" or "window"
  const winDays = dei - dsi + 1;

  // Filter by category (driven by the chips at top of view)
  const filtered = opFilter==="all" ? OPERATORS : OPERATORS.filter(o => o.c===opFilter);
  const JUL_DAYS = daysInYM(next1YM), AUG_DAYS = daysInYM(next2YM);
  const rows = filtered.map(o=>{
    const winTotal = prodSum(o.n, dsi, dei);
    const winAvg = winDays>0 ? winTotal/winDays : 0;
    const aprTotal = prodSum(o.n, aprStart, mtdStart-1);
    const mtdTotal = prodSum(o.n, mtdStart, DAILY_EC.length-1);
    // End-of-Jun projection (current month context)
    const projMay = MAY_DAYS_ELAPSED>0 ? Math.round((mtdTotal/MAY_DAYS_ELAPSED)*MAY_DAYS) : 0;
    // Next 3 full months use trailing-30 daily avg × days in each month
    const trailing30Avg = prodSum(o.n, Math.max(0,DAILY_EC.length-30), DAILY_EC.length-1)/30;
    const projJun = projMay; // current month: same as PROJ JUN (MTD pace)
    const projJul = Math.round(trailing30Avg * JUL_DAYS);
    const projAug = Math.round(trailing30Avg * AUG_DAYS);
    const threeMoTotal = projJun + projJul + projAug;   // next 3 full months
    const momPct = aprTotal>0 ? ((projMay - aprTotal)/aprTotal*100) : null;
    // Trend signal: compare trailing-30 vs prior-30 daily avg
    const prior30Avg = prodSum(o.n, Math.max(0,DAILY_EC.length-60), Math.max(0,DAILY_EC.length-31))/30;
    const trendPct = prior30Avg>0 ? ((trailing30Avg - prior30Avg)/prior30Avg*100) : null;
    return {...o, winTotal, winAvg, aprTotal, mtdTotal, projMay, projJun, projJul, projAug, threeMoTotal, momPct, trendPct, trailing30Avg};
  });
  const sortKey = sortBy==="proj" ? "projMay" : sortBy==="window" ? "winTotal" : "threeMoTotal";
  rows.sort((a,b)=> b[sortKey] - a[sortKey]);

  // Category totals — picker-driven window + fixed MTD/projection columns
  const totalsByCat = PRODUCT_KEYS.reduce((acc,k)=>{
    acc[k]={win:0,mtd:0,projMay:0,aprTotal:0,projJun:0,projJul:0,projAug:0,threeMo:0};
    OPERATORS.forEach(o=>{if(o.c===k){
      const w = prodSum(o.n, dsi, dei);
      const mt=prodSum(o.n, mtdStart, DAILY_EC.length-1);
      const apr=prodSum(o.n, aprStart, mtdStart-1);
      const pmay = MAY_DAYS_ELAPSED>0 ? Math.round((mt/MAY_DAYS_ELAPSED)*MAY_DAYS) : 0;
      const t30 = prodSum(o.n, Math.max(0,DAILY_EC.length-30), DAILY_EC.length-1)/30;
      const pjun = pmay; // match PROJ JUN (MTD pace)
      const pjul = Math.round(t30 * 31);
      const paug = Math.round(t30 * 31);
      acc[k].win+=w;
      acc[k].mtd+=mt;
      acc[k].aprTotal+=apr;
      acc[k].projMay+=pmay;
      acc[k].projJun+=pjun;
      acc[k].projJul+=pjul;
      acc[k].projAug+=paug;
      acc[k].threeMo+=pjun+pjul+paug;
    }});
    return acc;
  },{});
  const grandWin=Object.values(totalsByCat).reduce((a,t)=>a+t.win,0);
  const grandMtd=Object.values(totalsByCat).reduce((a,t)=>a+t.mtd,0);
  const grandProjMay=Object.values(totalsByCat).reduce((a,t)=>a+t.projMay,0);
  const grandApr=Object.values(totalsByCat).reduce((a,t)=>a+t.aprTotal,0);
  const grand3mo=Object.values(totalsByCat).reduce((a,t)=>a+t.threeMo,0);
  const grandProjJun=Object.values(totalsByCat).reduce((a,t)=>a+t.projJun,0);
  const grandProjJul=Object.values(totalsByCat).reduce((a,t)=>a+t.projJul,0);
  const grandProjAug=Object.values(totalsByCat).reduce((a,t)=>a+t.projAug,0);

  // Check if window covers the full current month (MTD) — used to suppress redundancy
  const winIsMTD = (dsi===mtdStart && dei===DAILY_EC.length-1);
  const windowLabel = winIsMTD ? "MTD" : `${winDays}d window`;

  return <div>

// ─── Apps Script live-data layer ─────────────────────────────────────────────
// Browser fetches fresh GA4 data from your Apps Script Web App on every page load.
// Historical monthly arrays (MONTHS, TOTAL_EC, HOSTS.data, PRODUCTS.data) are
// hardcoded above; everything else (daily series, MTD, LAST7, top pages) comes live.
// Setup: deploy apps-script-ga4-api.js as a Web App and paste the URL below.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3ESKrUJPALGrJQkMlGtKQvXgD6B2lCXy8ZdNa__O1f69y4H0vAxqA71_zqee5w90xbQ/exec';

function applyLiveData(live) {
  // Replace daily series and current-period metrics with live values
  DAILY_EC        = live.DAILY_EC;
  DAILY_SESS      = live.DAILY_SESS;
  PROD_DAILY      = live.PROD_DAILY;
  HOST_DAILY      = live.HOST_DAILY;
  MTD             = live.MTD;
  LAST7           = live.LAST7;
  TOP_PAGES_LAST7 = live.TOP_PAGES_LAST7;
  TOP_PAGES_MTD   = live.TOP_PAGES_MTD;
  DATA_AS_OF      = live.dataAsOf;
  MAY_DAYS_ELAPSED = live.MTD.daysElapsed;
  MAY_DAYS         = live.MTD.daysInMonth;

  // Recompute derived date structures from the fresh arrays
  DAILY_DATES        = _computeDailyDates();
  FIRST_OF_MONTH_IDX = (()=>{ const r={}; DAILY_DATES.forEach((d,i)=>{const ym=d.slice(0,6);if(!(ym in r)) r[ym]=i;}); return r; })();

  const de = live.MTD.daysElapsed || 1;
  const di = live.MTD.daysInMonth || 30;

  // Update current-month projected entry (last slot) in each monthly total array
  TOTAL_EC[TOTAL_EC.length-1]     = Math.round(live.MTD.ec / de * di);
  TOTAL_SESS[TOTAL_SESS.length-1] = Math.round((live.MTD.sessionsUnfiltered || live.MTD.sessions) / de * di);
  TOTAL_USERS[TOTAL_USERS.length-1] = Math.round((live.MTD.usersUnfiltered || live.MTD.users) / de * di);

  // Per-host current-month projection from HOST_DAILY MTD slice
  HOST_KEYS.forEach(key => {
    const h = HOSTS[key];
    const series = live.HOST_DAILY[h.host];
    if (series && series.length >= de) {
      h.data[h.data.length-1] = Math.round(series.slice(-de).reduce((a,b)=>a+b,0) / de * di);
    } else {
      h.data[h.data.length-1] = 0;
    }
  });

  // Per-category current-month projection from PROD_DAILY MTD slice
  // Uses OPERATORS to map GA4 product names → dashboard categories
  const catMtd = {};
  PRODUCT_KEYS.forEach(k => catMtd[k] = 0);
  const pcm = {};
  OPERATORS.forEach(op => { pcm[op.n] = op.c; });
  Object.entries(live.PROD_DAILY).forEach(([name, arr]) => {
    const cat = pcm[name] || 'other';
    if (catMtd[cat] === undefined) catMtd[cat] = 0;
    if (arr.length >= de) catMtd[cat] += arr.slice(-de).reduce((a,b)=>a+b,0);
  });
  PRODUCT_KEYS.forEach(cat => {
    PRODUCTS[cat].data[PRODUCTS[cat].data.length-1] = Math.round((catMtd[cat]||0) / de * di);
  });
}

const TOP_TABS=[{k:"rollup",label:"Rollup"},{k:"subsites",label:"Subsites"},{k:"comparison",label:"Comparison"}];
function GannettDashboard(){
  const [topTab,setTopTab]=useState("rollup");
  return <div>
    <div className="stamp">Data current as of {DATA_AS_OF} · GA4 property 406717704 · event affiliate_click · product = customEvent:product</div>
    <div style={{display:"flex",borderBottom:"2px solid #e5e7eb",marginBottom:"1.5rem"}}>
      {TOP_TABS.map(t=>{const active=topTab===t.k;return <button key={t.k} onClick={()=>setTopTab(t.k)} style={{fontSize:15,fontWeight:active?700:400,padding:"12px 32px",border:"none",background:"transparent",cursor:"pointer",marginBottom:-2,borderBottom:active?"3px solid #111827":"3px solid transparent",color:active?"#111827":"#6b7280"}}>{t.label}</button>;})}
    </div>
    {topTab==="rollup"&&<RollupTab/>}
    {topTab==="subsites"&&<SubsitesTab/>}
    {topTab==="comparison"&&<ComparisonTab/>}
  </div>;
}

// DashboardApp: shows cached data immediately, then re-renders with live GA4 data
// once the Apps Script responds. Full remount (key prop) ensures all components
// re-read updated globals.
function DashboardApp() {
  const [renderKey, setRenderKey] = useState(0);
  const [status,    setStatus]    = useState('loading'); // 'loading' | 'live' | 'stale'
  const [fetchMsg,  setFetchMsg]  = useState('');

  useEffect(() => {
    fetch(APPS_SCRIPT_URL + '?endpoint=all')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(live => {
        if (live.error) throw new Error(live.error);
        applyLiveData(live);
        setStatus('live');
        setRenderKey(k => k + 1);
      })
      .catch(e => {
        console.warn('[Dashboard] Live fetch failed:', e.message);
        setFetchMsg(e.message);
        setStatus('stale');
        setRenderKey(k => k + 1);
      });
  }, []);

  const bs = {padding:'6px 14px',marginBottom:'0.5rem',borderRadius:6,fontSize:12,display:'flex',alignItems:'center',gap:8};
  return <div>
    {status==='loading' && <div style={{...bs,background:'#eff6ff',color:'#1d4ed8',border:'1px solid #bfdbfe'}}>⏳ Fetching live data from GA4…</div>}
    {status==='stale'   && <div style={{...bs,background:'#fffbeb',color:'#92400e',border:'1px solid #fbbf24'}}>⚠️ Showing cached data — live fetch failed: {fetchMsg}</div>}
    {status==='live'    && <div style={{...bs,background:'#f0fdf4',color:'#15803d',border:'1px solid #bbf7d0'}}>✓ Live GA4 data · as of {DATA_AS_OF} · refreshes on each page load</div>}
    <GannettDashboard key={renderKey}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp/>);
</script>
